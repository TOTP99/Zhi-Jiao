<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>御猫灵局 · UI 自检</title>
<style>
  body{font:14px/1.6 -apple-system,"PingFang SC",sans-serif;background:#111;color:#ddd;margin:0;padding:16px 16px 40px;max-width:760px}
  h1{font-size:18px;margin:0 0 4px} #sum{margin:0 0 14px;font-size:16px}
  .ok{color:#7ad17a}.bad{color:#ff7b72;font-weight:600}
  li{margin:2px 0;list-style:none} ul{padding:0}
  h2{font-size:15px;margin:18px 0 6px;color:#aaa;font-weight:600;border-bottom:1px solid #333;padding-bottom:4px}
  #frame{width:100%;height:420px;border:1px solid #333;background:#000;margin-top:12px}
</style></head><body>
<h1>御猫灵局 · UI 自检页</h1>
<p>用浏览器打开本文件即可（需与 index.html / js/ 同目录）。在下方内嵌的真实应用里跑 UI 断言：tab 切换、弹窗开关、档案边界、掌纹图像端到端。只读，不改动应用数据（生辰档案测试会临时写入并立即恢复）。</p>
<p id="fileWarn" style="display:none;color:#ffb454;border:1px solid #6b4a14;padding:8px 10px;border-radius:6px">检测到用 file:// 直接打开：浏览器会拦截内嵌应用的跨域访问，测试会整页失败。请在本文件夹运行 <code>python3 -m http.server</code>，再访问 http://localhost:8000/ui-tests.html。</p>
<p id="sum">等待应用加载…</p><ul id="out"></ul>
<iframe id="frame" src="index.html" title="御猫灵局应用"></iframe>
<script>
(function () {
  if (location.protocol === 'file:') document.getElementById('fileWarn').style.display = 'block';
  var out = document.getElementById('out'), pass = 0, fail = 0;
  function section(title) {
    var h = document.createElement('h2'); h.textContent = title; out.appendChild(h);
  }
  async function t(name, fn) {
    var ok = false, msg = '';
    try {
      var r = await fn();
      ok = (r === undefined || r === true); if (!ok) msg = String(r);
    } catch (e) { msg = e && e.message || String(e); }
    ok ? pass++ : fail++;
    var li = document.createElement('li'); li.className = ok ? 'ok' : 'bad';
    li.textContent = (ok ? '✓ ' : '✗ ') + name + (ok ? '' : ' —— ' + msg);
    out.appendChild(li);
  }
  function sum() {
    var s = document.getElementById('sum');
    s.textContent = fail === 0 ? ('全部通过：' + pass + ' / ' + (pass + fail)) : ('有 ' + fail + ' 项失败 / 共 ' + (pass + fail) + ' 项');
    s.style.color = fail === 0 ? '#7ad17a' : '#ff7b72';
  }
  function loadScriptInto(win, src) {
    return new Promise(function (resolve, reject) {
      var s = win.document.createElement('script');
      s.src = src; s.onload = resolve; s.onerror = function () { reject(new Error('load fail: ' + src)); };
      win.document.head.appendChild(s);
    });
  }
  /* 造一张测试图：纯色画布 / 肤色实心椭圆，返回 ImageData */
  function makeImageData(win, draw, w, h) {
    w = w || 200; h = h || 200;
    var cv = win.document.createElement('canvas'); cv.width = w; cv.height = h;
    var ctx = cv.getContext('2d'); draw(ctx, w, h);
    return ctx.getImageData(0, 0, w, h);
  }
  var frame = document.getElementById('frame');
  frame.addEventListener('load', function () {
    var W = frame.contentWindow, D = frame.contentDocument;
    var sleepMs = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };
    (async function () {
      /* 等 defer 脚本 + 开屏 */
      await sleepMs(600);
      var hasShow = function (id) { var el = D.getElementById(id); return !!(el && el.classList.contains('show')); };
      /* ── Tab 切换 ── */
      section('Tab 切换');
      await t('切到 charts：view-charts 有 .on', function () {
        W.switchTab('charts');
        return D.getElementById('view-charts').classList.contains('on') || 'view-charts 未高亮';
      });
      await t('切到 me：view-me 有 .on，charts 已收起', function () {
        W.switchTab('me');
        return D.getElementById('view-me').classList.contains('on') && !D.getElementById('view-charts').classList.contains('on') || 'tab 状态不对';
      });
      await t('切回 divine：view-divine 有 .on', function () {
        W.switchTab('divine');
        return D.getElementById('view-divine').classList.contains('on') || 'view-divine 未高亮';
      });
      await t('tab 切换入 history（state 有 yumiaoTab）', function () {
        W.switchTab('charts');
        var ok = W.history.state && W.history.state.yumiaoTab === 'charts';
        W.history.back();
        return ok || ('state=' + JSON.stringify(W.history.state));
      });
      await sleepMs(120);
      W.switchTab('divine');
      /* ── 弹窗开关 ── */
      section('弹窗开关');
      await t('紫微打开：ziweiModal 有 .show 且入 history', function () {
        W.openZiwei();
        var el = D.getElementById('ziweiModal');
        return el.classList.contains('show') && W.YumiaoNav.isOpen('ziweiModal') || '紫微未打开或未入栈';
      });
      await t('紫微 X 关闭：.show 移除', function () {
        W.closeSheetByBtn(D.querySelector('#ziweiModal .sheet-close'));
        return !hasShow('ziweiModal') || '紫微未关闭';
      });
      await t('紫微计算说明：#ziweiBody 里有 details.ziwei-calc-note', async function () {
        var prev = W.localStorage.getItem('yumiao_shared_birth_v1');
        W.localStorage.setItem('yumiao_shared_birth_v1', JSON.stringify({ year: 1990, month: 5, day: 17, hour: 10, sex: 'F', tzOffset: -5, tzName: 'America/Toronto', city: 'Toronto' }));
        W.openZiwei();
        await sleepMs(300);
        var d = D.querySelector('#ziweiBody .mbti-report details.ziwei-calc-note');
        var ok = !!(d && d.querySelectorAll('li').length >= 8) || '计算说明缺失、条数不足或不在报告片段内（记录下载带不走）';
        W.closeSheetByBtn(D.querySelector('#ziweiModal .sheet-close'));
        if (prev == null) W.localStorage.removeItem('yumiao_shared_birth_v1'); else W.localStorage.setItem('yumiao_shared_birth_v1', prev);
        return ok;
      });
      await t('掷筊：选 108 问后手动改输入框 → 清除预设分类，按新问题关键词判断', async function () {
        var q = D.getElementById('question');
        W.setPreferredCategory('job');
        var before = W.resolveCategory('是否适合创业');
        q.value = '今天适合出门吗'; q.dispatchEvent(new W.Event('input', { bubbles: true }));
        var after = W.resolveCategory(q.value);
        W.clearPreferredCategory();
        return (before === 'job' && after !== 'job') || ('before=' + before + ' after=' + after);
      });
      await t('掷筊：选 108 问（填入文字）不会触发清除，分类保留到真正输入为止', async function () {
        var q = D.getElementById('question'), item = null;
        W.selectCasualQuestion(0);
        var kept = W.resolveCategory(q.value);
        W.clearPreferredCategory();
        return !!kept || '108 问第 1 条未带分类';
      });
      await t('星盘：档案只有半截坐标（有纬度无经度 / 越界）也能出盘，不报「分析出错」', async function () {
        var prev = W.localStorage.getItem('yumiao_shared_birth_v1'), bad = [];
        var cases = [{ lat: 43.7, lng: null }, { lat: null, lng: -79.4 }, { lat: 200, lng: 10 }, { lat: 'x', lng: 'y' }];
        for (var i = 0; i < cases.length; i++) {
          var b = { year: 1990, month: 5, day: 17, hour: 10, minute: 0, sex: 'F', gender: '女', tzOffset: -5, tzName: 'America/Toronto', city: 'Toronto', lat: cases[i].lat, lng: cases[i].lng };
          W.localStorage.setItem('yumiao_shared_birth_v1', JSON.stringify(b));
          W.openWesternPanel(); await sleepMs(500);
          W.submitWesternForm(); await sleepMs(900);
          if (!D.querySelector('#westernModal .western-chart-viz svg')) bad.push(JSON.stringify(cases[i]));
          W.closeSheetByBtn(D.querySelector('#westernModal .sheet-close')); await sleepMs(300);
        }
        if (prev == null) W.localStorage.removeItem('yumiao_shared_birth_v1'); else W.localStorage.setItem('yumiao_shared_birth_v1', prev);
        return bad.length === 0 || ('未出盘：' + bad.join(' '));
      });
      await t('MBTI：未答完时「查看详细解读」禁用并写明还差几题；进度条同样提示', async function () {
        W.openMbtiQuiz(); await sleepMs(500);
        var b = D.getElementById('mbtiCastBtn'), pr = D.getElementById('mbtiProgress');
        var r = b.disabled && /还差 \d+ 题/.test(b.textContent) && /还差 \d+ 题/.test(pr.textContent);
        W.closeSheetByBtn(D.querySelector('#mbtiModal .sheet-close'));
        return r || ('btn=' + b.textContent + ' disabled=' + b.disabled + ' progress=' + pr.textContent);
      });
      await t('「我的」改档案：不出现「跳过」，按钮为「取消」且点后关闭、不改档案', async function () {
        var before = W.localStorage.getItem('yumiao_shared_birth_v1');
        W.editProfile(); await sleepMs(300);
        var sk = D.getElementById('obSkip'), ob = D.getElementById('onboard');
        var label = sk.textContent;
        sk.click(); await sleepMs(500);
        var closed = !ob.classList.contains('show'), same = W.localStorage.getItem('yumiao_shared_birth_v1') === before;
        return (label === '取消' && closed && same) || ('label=' + label + ' closed=' + closed + ' same=' + same);
      });
      await t('周易打开：内部挂载，无 iframe', async function () {
        W.openYi();
        var ok = false;
        for (var i = 0; i < 30; i++) {
          await sleepMs(200);
          var m = D.getElementById('yiApp');
          if (m && m.querySelector('.book-title')) { ok = true; break; }
        }
        var noFrame = !D.querySelector('#yiOverlay iframe');
        var bar = !!D.querySelector('#yiOverlay .yi-bar .yi-back');
        W.closeYi();
        await sleepMs(300);
        var closed = !D.getElementById('yiOverlay').classList.contains('show');
        return (ok && noFrame && bar && closed) || '周易未渲染/仍有 iframe/未关闭';
      });
      await t('八字打开即排（有档案时直接出结果）', async function () {
        W.localStorage.setItem('yumiao_shared_birth_v1', JSON.stringify({ year: 1990, month: 6, day: 15, hour: 12, sex: 'M', tzOffset: 8, city: 'Toronto' }));
        W.openBaziPanel();
        /* 八字模块懒加载，轮询等报告出现，最多 6 秒 */
        var rep = '';
        for (var i = 0; i < 30; i++) {
          rep = D.getElementById('baziReport').innerHTML;
          if (rep.length > 100) break;
          await sleepMs(200);
        }
        W.closeBaziPanel();
        return rep.length > 100 || ('report len ' + rep.length);
      });
      await t('历史记录打开/关闭', function () {
        W.toggleHistory();
        var open = hasShow('historyModal');
        W.toggleHistory();
        return open && !hasShow('historyModal') || '历史记录开关异常';
      });
      await t('关于与声明入口可见且可打开', function () {
        var btn = D.querySelector('[onclick="openDisclaimer()"]');
        if (!btn || btn.hasAttribute('hidden')) return '关于入口被 hidden';
        W.openDisclaimer();
        var open = hasShow('disclaimerSheet');
        W.closeDisclaimer();
        return open && !hasShow('disclaimerSheet') || '声明弹窗开关异常';
      });
      /* ── 档案边界（collectProfile）── */
      section('档案边界');
      function setObDate(v) { D.getElementById('obDate').value = v; }
      function setObCity(v) {
        D.querySelectorAll('#obCity button').forEach(function (b) { b.classList.toggle('on', b.dataset.v === v); });
      }
      await t('未来日期被拦截', function () {
        setObDate('2099-01-01');
        return W.collectProfile ? (W.collectProfile() === null || '未来日期未拦截') : 'collectProfile 未暴露';
      });
      await t('年份 1899 被拦截', function () {
        setObDate('1899-06-15');
        return W.collectProfile() === null || '1899 未拦截';
      });
      await t('年份 2101 被拦截', function () {
        setObDate('2101-06-15');
        return W.collectProfile() === null || '2101 未拦截';
      });
      await t('年份 1900 边界可通过（2100 属未来日期，另由未来规则拦截）', function () {
        setObDate('1900-06-15');
        var a = W.collectProfile();
        setObDate('2100-06-15');
        var b = W.collectProfile();
        return !!(a && a.year === 1900 && b === null) || '1900 未通过或 2100 未被未来规则拦截';
      });
      await t('时区 -12 / +14 边界可通过，+15 被拦截（其他城市）', function () {
        setObDate('1990-06-15'); setObCity('other');
        D.getElementById('obTz').value = '-12';
        var a = W.collectProfile();
        D.getElementById('obTz').value = '15';
        var b = W.collectProfile();
        return !!(a && a.tzOffset === -12 && b === null) || '时区边界异常';
      });
      await t('纬度 91 / 经度 181 被拦截（其他城市）', function () {
        setObDate('1990-06-15'); setObCity('other');
        D.getElementById('obTz').value = '-5';
        D.getElementById('obLat').value = '91';
        var a = W.collectProfile();
        D.getElementById('obLat').value = '43';
        D.getElementById('obLng').value = '181';
        var b = W.collectProfile();
        return a === null && b === null || '经纬度越界未拦截';
      });
      /* 恢复档案与城市 */
      setObDate('1990-06-15'); setObCity('toronto');
      D.getElementById('obTz').value = ''; D.getElementById('obLat').value = ''; D.getElementById('obLng').value = '';
      /* ── 掌纹图像端到端 ── */
      section('掌纹图像端到端');
      try { await loadScriptInto(W, 'js/17-palm.js'); } catch (e) { /* 已加载时可能重复，忽略 */ }
      await sleepMs(200);
      var PM = W.YumiaoPalm;
      await t('掌纹模块已加载（YumiaoPalm.analyzeImage 可用）', function () {
        return !!(PM && typeof PM.analyzeImage === 'function') || 'YumiaoPalm 未加载';
      });
      await t('掌纹弹窗默认不显示引导卡片', function () {
        W.openPalmPanel();
        var el = D.getElementById('palmGuideSet');
        var ok = !!(el && el.hidden === true);
        W.closePalmPanel();
        return ok || '引导卡片默认应隐藏';
      });
      await t('结果页有「重新拍一张」按钮', function () {
        var b = D.getElementById('palmRetake');
        return !!(b && b.parentElement && b.parentElement.id === 'palmResultActions') || 'palmRetake 不在结果操作栏';
      });
      await t('引导卡片与对照图并成一套、状态同步', function () {
        W.openPalmPanel();
        var btn = D.getElementById('palmGuideBtn'), set = D.getElementById('palmGuideSet'), card = D.getElementById('palmGuideCard'), diag = D.getElementById('palmGuide');
        if (!btn || !set || !card || !diag || !set.contains(card) || !set.contains(diag)) { W.closePalmPanel(); return '引导元素缺失或未并入同一容器'; }
        btn.click();
        var open = !set.hidden && btn.classList.contains('on');
        btn.click();
        var closed = set.hidden && !btn.classList.contains('on');
        W.closePalmPanel();
        return (open && closed) || '点开/点关后卡片、对照图、按钮状态不同步';
      });
      await t('非肤色图 → nohand（纯蓝画布）', async function () {
        var im = makeImageData(W, function (ctx, w, h) { ctx.fillStyle = '#0000ff'; ctx.fillRect(0, 0, w, h); });
        var res = await PM.analyzeImage(im.data, im.width, im.height, { hand: 'L' });
        return (!res.ok && res.reason === 'nohand') || ('reason=' + res.reason + ' ok=' + res.ok);
      });
      await t('纯色肤色椭圆 → lowcontrast（无纹理）', async function () {
        var im = makeImageData(W, function (ctx, w, h) {
          ctx.fillStyle = '#222222'; ctx.fillRect(0, 0, w, h);
          ctx.fillStyle = 'rgb(200,150,120)';
          ctx.beginPath(); ctx.ellipse(w / 2, h / 2, 70, 90, 0, 0, Math.PI * 2); ctx.fill();
        });
        var res = await PM.analyzeImage(im.data, im.width, im.height, { hand: 'L' });
        return (!res.ok && res.reason === 'lowcontrast') || ('reason=' + res.reason + ' ok=' + res.ok);
      });
      /* 清理：恢复默认档案 */
      W.localStorage.setItem('yumiao_shared_birth_v1', JSON.stringify({ year: 1990, month: 6, day: 15, hour: 12, sex: 'M', tzOffset: 8, city: 'Toronto' }));
      sum();
    })().catch(function (e) {
      var li = document.createElement('li'); li.className = 'bad';
      li.textContent = '✗ 测试流程异常 —— ' + (e && e.message || e);
      out.appendChild(li); sum();
    });
  });
})();
</script>
</body></html>
