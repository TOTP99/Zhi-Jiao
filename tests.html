<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>御猫灵局 · 自检</title>
<style>
  body{font:14px/1.6 -apple-system,"PingFang SC",sans-serif;background:#111;color:#ddd;margin:0;padding:16px 16px 40px;max-width:720px}
  h1{font-size:18px;margin:0 0 4px} #sum{margin:0 0 14px;font-size:16px}
  .ok{color:#7ad17a}.bad{color:#ff7b72;font-weight:600}
  li{margin:2px 0;list-style:none} ul{padding:0}
</style></head><body>
<h1>御猫灵局 · 自检页</h1>
<p>直接用浏览器打开本文件即可（需与 js/ 同目录）。只读，不改动任何数据。</p>
<p id="sum">运行中…</p><ul id="out"></ul>
<script src="js/00-error-guard.js"></script>
<script src="js/11a-chenggu-verses.js"></script>
<script src="js/11b-chenggu-modern.js"></script>
<script src="js/11-chenggu.js"></script>
<script>
(function () {
  var out = document.getElementById('out'), pass = 0, fail = 0;
  function t(name, fn) {
    var ok = false, msg = '';
    try { var r = fn(); ok = (r === undefined || r === true); if (!ok) msg = String(r); } catch (e) { msg = e && e.message || String(e); }
    ok ? pass++ : fail++;
    var li = document.createElement('li'); li.className = ok ? 'ok' : 'bad';
    li.textContent = (ok ? '✓ ' : '✗ ') + name + (msg ? ' —— ' + msg : '');
    out.appendChild(li);
  }
  function eq(a, b) { return JSON.stringify(a) === JSON.stringify(b) || ('期望 ' + JSON.stringify(b) + ' 实得 ' + JSON.stringify(a)); }
  var L = window.__solarToLunar, C = window.__chengguCalc;

  /* 农历换算 */
  t('2024-02-10 = 农历正月初一', function () { var r = L(2024, 2, 10); return eq([r.year, r.month, r.day, r.leap], [2024, 1, 1, false]); });
  t('2023-03-22 = 闰二月初一', function () { var r = L(2023, 3, 22); return eq([r.year, r.month, r.day, r.leap], [2023, 2, 1, true]); });
  t('2020-05-23 = 闰四月初一', function () { var r = L(2020, 5, 23); return eq([r.year, r.month, r.day, r.leap], [2020, 4, 1, true]); });
  t('2000-01-01 = 1999 年十一月廿五', function () { var r = L(2000, 1, 1); return eq([r.year, r.month, r.day], [1999, 11, 25]); });
  t('超出 1900–2100 返回 null 而不是抛错', function () { return eq([L(1899, 1, 1), L(2101, 1, 1)], [null, null]); });
  t('1900–2100 每月 1–28 日换算都落在合法范围（1900 年春节前除外）', function () {
    var bad = 0;
    for (var y = 1900; y <= 2100; y++) for (var m = 1; m <= 12; m++) for (var d = 1; d <= 28; d++) {
      if (y === 1900 && m === 1) continue;
      var r = L(y, m, d); if (!r || r.day < 1 || r.day > 30 || r.month < 1 || r.month > 12) bad++;
    }
    return bad === 0 || ('异常 ' + bad + ' 个');
  });

  /* 称骨 */
  t('1990-05-17 10时 = 4两2钱（9+9+8+16）', function () { var r = C({ year: 1990, month: 5, day: 17, hour: 10 }); return eq([r.yw, r.mw, r.dw, r.hw, r.total], [9, 9, 8, 16, 42]); });
  t('23:00 算子时', function () { return eq(C({ year: 1990, month: 5, day: 17, hour: 23 }).hourName, '子'); });
  t('缺时辰按午时，并标记 hourDefault', function () { var r = C({ year: 1990, month: 5, day: 17 }); return eq([r.hourName, r.hourDefault], ['午', true]); });
  t('生辰不完整返回 error，不抛错', function () { return !!C({ year: 'x', month: 1, day: 1 }).error; });
  t('骨重全范围落在 21–72 钱（有批语）', function () {
    var lo = 99, hi = 0, miss = [];
    for (var y = 1900; y <= 2100; y += 3) for (var m = 1; m <= 12; m++) for (var d = 1; d <= 28; d += 3) for (var h = 0; h < 24; h += 2) {
      var r = C({ year: y, month: m, day: d, hour: h }); if (!r.total) continue;
      lo = Math.min(lo, r.total); hi = Math.max(hi, r.total);
      if (!window.CHENGGU_VERSES[r.total]) miss.push(r.total);
    }
    return (lo >= 21 && hi <= 72 && !miss.length) || ('范围 ' + lo + '–' + hi + ' 缺批语 ' + miss.slice(0, 5));
  });
  t('原文批语 52 档（21–72），无空值', function () {
    for (var k = 21; k <= 72; k++) if (!window.CHENGGU_VERSES[k] || !String(window.CHENGGU_VERSES[k]).trim()) return '缺 ' + k;
  });
  t('今用 与 原文 键完全一致', function () {
    var a = Object.keys(window.CHENGGU_VERSES).sort().join(), b = Object.keys(window.CHENGGU_MODERN).sort().join();
    return a === b || '键不一致';
  });

  /* 错误边界 */
  t('错误边界已安装', function () { return window.__yumiaoGuardInstalled === true; });
  t('错误边界：未捕获错误被处理且不白屏', function () {
    return typeof window.onerror === 'function' && window.onerror('测试错误', '', 0, 0, new Error('x')) === true;
  });

  var s = document.getElementById('sum');
  s.className = fail ? 'bad' : 'ok';
  s.textContent = fail ? ('有 ' + fail + ' 项失败 / 共 ' + (pass + fail) + ' 项') : ('全部通过：' + pass + ' / ' + pass);
  document.title = (fail ? '✗ ' : '✓ ') + s.textContent;
})();
</script></body></html>
