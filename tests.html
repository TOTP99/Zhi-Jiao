<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>御猫灵局 · 自检</title>
<style>
  body{font:14px/1.6 -apple-system,"PingFang SC",sans-serif;background:#111;color:#ddd;margin:0;padding:16px 16px 40px;max-width:720px}
  h1{font-size:18px;margin:0 0 4px} #sum{margin:0 0 14px;font-size:16px}
  .ok{color:#7ad17a}.bad{color:#ff7b72;font-weight:600}
  li{margin:2px 0;list-style:none} ul{padding:0}
  h2{font-size:15px;margin:18px 0 6px;color:#aaa;font-weight:600;border-bottom:1px solid #333;padding-bottom:4px}
</style></head><body>
<h1>御猫灵局 · 自检页</h1>
<p>直接用浏览器打开本文件即可（需与 js/ 同目录）。只读，不改动任何数据（生辰存取测试会临时写入并立即恢复）。</p>
<p id="sum">运行中…</p><ul id="out"></ul>
<script src="js/00-error-guard.js"></script>
<script src="js/00a-lunar.js"></script>
<script src="js/00b-core.js"></script>
<script src="js/00c-version.js"></script>
<script src="js/24-backup.js"></script>

<script src="js/03-bazi-engine.js"></script>

<script src="js/13-wuge.js"></script>

<script src="js/15-ziwei.js"></script>
<script src="js/16-sound.js"></script>
<script src="js/17-palm.js"></script>
<script src="js/17a-palm-rectify.js"></script>
<script src="js/17b-palm-insight.js"></script>
<script src="js/18-yijing-data-1.js"></script>
<script src="js/19-yijing-data-2.js"></script>
<script src="js/20-yijing-data-3.js"></script>
<script src="js/21-yijing-data-4.js"></script>
<script src="js/22-yijing-core.js"></script>
<script>
(function () {
  var out = document.getElementById('out'), pass = 0, fail = 0;
  function section(title) {
    var h = document.createElement('h2');
    h.textContent = title;
    out.appendChild(h);
  }
  function t(name, fn) {
    var ok = false, msg = '';
    try { var r = fn(); ok = (r === undefined || r === true); if (!ok) msg = String(r); } catch (e) { msg = e && e.message || String(e); }
    ok ? pass++ : fail++;
    var li = document.createElement('li'); li.className = ok ? 'ok' : 'bad';
    li.textContent = (ok ? '✓ ' : '✗ ') + name + (msg ? ' —— ' + msg : '');
    out.appendChild(li);
  }
  /* v2.16：异步用例（摆正回退）。汇总在全部异步用例落定后才写，避免提前读数。 */
  var pendingAsync = 0;
  function finish() {
    var s = document.getElementById('sum');
    s.className = fail ? 'bad' : 'ok';
    s.textContent = fail ? ('有 ' + fail + ' 项失败 / 共 ' + (pass + fail) + ' 项') : ('全部通过：' + pass + ' / ' + pass);
    document.title = (fail ? '✗ ' : '✓ ') + s.textContent;
  }
  function tAsync(name, fn) {
    pendingAsync++;
    var li = document.createElement('li');
    li.textContent = '… ' + name;
    out.appendChild(li);
    Promise.resolve().then(fn).then(function (r) {
      var ok = (r === undefined || r === true), msg = ok ? '' : String(r);
      li.className = ok ? 'ok' : 'bad';
      li.textContent = (ok ? '✓ ' : '✗ ') + name + (msg ? ' —— ' + msg : '');
      ok ? pass++ : fail++;
      if (--pendingAsync === 0) finish();
    }).catch(function (e) {
      li.className = 'bad';
      li.textContent = '✗ ' + name + ' —— ' + (e && e.message || String(e));
      fail++;
      if (--pendingAsync === 0) finish();
    });
  }
  function eq(a, b) { return JSON.stringify(a) === JSON.stringify(b) || ('期望 ' + JSON.stringify(b) + ' 实得 ' + JSON.stringify(a)); }
  function has(obj, keys) {
    for (var i = 0; i < keys.length; i++) if (!(keys[i] in obj)) return '缺字段 ' + keys[i];
    return true;
  }

  var L = window.__solarToLunar, C = window.__chengguCalc;

  /* ────────── 农历换算 ────────── */
  section('农历换算');
  t('2024-02-10 = 农历正月初一', function () { var r = L(2024, 2, 10); return eq([r.year, r.month, r.day, r.isLeap], [2024, 1, 1, false]); });
  t('2023-03-22 = 闰二月初一', function () { var r = L(2023, 3, 22); return eq([r.year, r.month, r.day, r.isLeap], [2023, 2, 1, true]); });
  t('2020-05-23 = 闰四月初一', function () { var r = L(2020, 5, 23); return eq([r.year, r.month, r.day, r.isLeap], [2020, 4, 1, true]); });
  t('农历单源化：1917 闰二月（旧 11 表错成闰三月）', function () { var r = L(1917, 3, 23); return eq([r.year, r.month, r.day, r.isLeap], [1917, 2, 1, true]); });
  t('农历单源化：1922 闰五月（旧 11 表错成闰六月）', function () { var r = L(1922, 6, 25); return eq([r.year, r.month, r.day, r.isLeap], [1922, 5, 1, true]); });
  t('农历单源化：1955 与香港天文台一致（03-15 = 二月廿二）', function () { var r = L(1955, 3, 15); return eq([r.year, r.month, r.day, r.isLeap], [1955, 2, 22, false]); });
  t('农历单源化：1987 闰六月（旧 11 表错成闰七月）', function () { var r = L(1987, 8, 1); return eq([r.year, r.month, r.day, r.isLeap], [1987, 6, 7, true]); });
  t('农历单源化：2070 二月初一（旧 11 表错成正月三十）', function () { var r = L(2070, 3, 12); return eq([r.year, r.month, r.day, r.isLeap], [2070, 2, 1, false]); });
  t('2000-01-01 = 1999 年十一月廿五', function () { var r = L(2000, 1, 1); return eq([r.year, r.month, r.day], [1999, 11, 25]); });
  t('超出 1900–2100 返回 null 而不是抛错', function () { return eq([L(1899, 1, 1), L(2101, 1, 1)], [null, null]); });
  t('不存在的公历日期返回 null：2024-02-31 / 2023-02-29 / 4-31 / 13 月 / 0 月 / 0 日', function () {
    return eq([L(2024, 2, 31), L(2023, 2, 29), L(2024, 4, 31), L(2024, 13, 1), L(2024, 0, 1), L(2024, 1, 0)], [null, null, null, null, null, null]);
  });
  t('非整数 / 非数字 / 空值返回 null 而不抛错', function () {
    return eq([L(2024, 2.5, 1), L(NaN, 1, 1), L(undefined, 1, 1), L(null, 1, 1), L('abc', 1, 1)], [null, null, null, null, null]);
  });
  t('闰日：2024-02-29 合法；2023/1900/2100-02-29 非法', function () {
    var r = L(2024, 2, 29);
    return eq([r && r.month, r && r.day, L(2023, 2, 29), L(1900, 2, 29), L(2100, 2, 29)], [1, 20, null, null, null]);
  });
  t('范围边界：1900-01-31 正月初一；1900-01-30 与 2101 为 null；2100-12-31 有结果', function () {
    var a = L(1900, 1, 31), z = L(2100, 12, 31);
    return eq([a && [a.year, a.month, a.day], L(1900, 1, 30), L(2101, 1, 1), !!z], [[1900, 1, 1], null, null, true]);
  });
  t('闰月边界：2023 闰二月廿九(04-19)后一天为三月初一；2020 闰四月廿九(06-20)后一天为五月初一', function () {
    var a = L(2023, 4, 19), b = L(2023, 4, 20), c = L(2020, 6, 20), d = L(2020, 6, 21);
    return eq([[a.month, a.day, a.isLeap], [b.month, b.day, b.isLeap], [c.month, c.day, c.isLeap], [d.month, d.day, d.isLeap]],
      [[2, 29, true], [3, 1, false], [4, 29, true], [5, 1, false]]);
  });
  t('字符串数字照常换算（档案里存的可能是字符串）', function () { var r = L('2024', '2', '10'); return eq([r.year, r.month, r.day], [2024, 1, 1]); });
  t('1900–2100 每月 1–28 日换算都落在合法范围（1900 年春节前除外）', function () {
    var bad = 0;
    for (var y = 1900; y <= 2100; y++) for (var m = 1; m <= 12; m++) for (var d = 1; d <= 28; d++) {
      if (y === 1900 && m === 1) continue;
      var r = L(y, m, d); if (!r || r.day < 1 || r.day > 30 || r.month < 1 || r.month > 12) bad++;
    }
    return bad === 0 || ('异常 ' + bad + ' 个');
  });

  /* ────────── 称骨 ────────── */
  section('称骨计算与批语');
  t('1990-05-17 10时 = 4两2钱（9+9+8+16）', function () { var r = C({ year: 1990, month: 5, day: 17, hour: 10 }); return eq([r.yw, r.mw, r.dw, r.hw, r.total], [9, 9, 8, 16, 42]); });
  t('23:00 算子时', function () { return eq(C({ year: 1990, month: 5, day: 17, hour: 23 }).hourName, '子'); });
  t('缺时辰按午时，并标记 hourDefault', function () { var r = C({ year: 1990, month: 5, day: 17 }); return eq([r.hourName, r.hourDefault], ['午', true]); });
  t('生辰不完整返回 error，不抛错', function () { return !!C({ year: 'x', month: 1, day: 1 }).error; });
  t('骨重全范围落在 21–72 钱（有批语）', function () {
    var lo = 99, hi = 0, miss = [];
    for (var y = 1900; y <= 2100; y += 3) for (var m = 1; m <= 12; m++) for (var d = 1; d <= 28; d += 3) for (var h = 0; h < 24; h += 2) {
      var r = C({ year: y, month: m, day: d, hour: h }); if (!r.total) continue;
      lo = Math.min(lo, r.total); hi = Math.max(hi, r.total);
      if (!window.CHENGGU_VERSES[r.total]) miss.push(r.total);
    }
    return (lo >= 21 && hi <= 72 && !miss.length) || ('范围 ' + lo + '–' + hi + ' 缺批语 ' + miss.slice(0, 5));
  });
  t('原文批语 52 档（21–72），无空值', function () {
    for (var k = 21; k <= 72; k++) if (!window.CHENGGU_VERSES[k] || !String(window.CHENGGU_VERSES[k]).trim()) return '缺 ' + k;
  });
  t('今用 与 原文 键完全一致', function () {
    var a = Object.keys(window.CHENGGU_VERSES).sort().join(), b = Object.keys(window.CHENGGU_MODERN).sort().join();
    return a === b || '键不一致';
  });

  /* ────────── 八字排盘边界 ────────── */
  section('八字排盘边界条件');
  t('BaziShensha API 已加载', function () {
    return !!(window.BaziShensha && typeof window.BaziShensha.calculate === 'function');
  });
  t('常量：天干 10、地支 12、五行 5', function () {
    var c = window.BaziShensha.constants;
    return eq([c.stems.length, c.branches.length, c.elements.length], [10, 12, 5]);
  });
  t('缺 year/month/day/hour 抛错', function () {
    var threw = false;
    try { window.BaziShensha.calculate({ year: 1990, month: 5, day: 17 }); } catch (e) { threw = true; }
    return threw || '未抛错';
  });
  /* ── 严格入参校验：Date.UTC 会把非法日期静默进位，必须在入口拒绝 ── */
  function bz(o) { var base = { year: 1990, month: 5, day: 17, hour: 10, minute: 0, timezone: 8 }; for (var k in o) base[k] = o[k]; return window.BaziShensha.calculate(base); }
  function rejects(o) { try { bz(o); return false; } catch (e) { return !!e.isInputError; } }
  t('非法日期拒绝：2024-02-31 / 2023-02-29 / 04-31 / 06-31 / 13 月 / 0 月 / 0 日 / 32 日', function () {
    var cases = [{ year: 2024, month: 2, day: 31 }, { year: 2023, month: 2, day: 29 }, { year: 2024, month: 4, day: 31 }, { year: 2024, month: 6, day: 31 },
      { month: 13 }, { month: 0 }, { day: 0 }, { day: 32 }];
    var bad = cases.filter(function (c) { return !rejects(c); });
    return bad.length === 0 || ('被接受：' + JSON.stringify(bad));
  });
  t('非法时间拒绝：小时 24 / -1、分钟 60 / -1、秒 60', function () {
    var bad = [{ hour: 24 }, { hour: -1 }, { minute: 60 }, { minute: -1 }, { second: 60 }].filter(function (c) { return !rejects(c); });
    return bad.length === 0 || ('被接受：' + JSON.stringify(bad));
  });
  t('非法时区 / 经度拒绝：+25、-13、+14.5；经度 ±181', function () {
    var bad = [{ timezone: 25 }, { timezone: -13 }, { timezone: 14.5 }, { longitude: 181 }, { longitude: -181 }, { longitude: NaN }].filter(function (c) { return !rejects(c); });
    return bad.length === 0 || ('被接受：' + JSON.stringify(bad));
  });
  t('非法类型拒绝：空串 / 小数 / 字母 / 布尔 / NaN / 数组', function () {
    var bad = [{ year: '' }, { month: 5.5 }, { day: 'abc' }, { year: true }, { hour: NaN }, { month: [5] }, { year: 1799 }, { year: 2201 }].filter(function (c) { return !rejects(c); });
    return bad.length === 0 || ('被接受：' + JSON.stringify(bad));
  });
  t('合法边界仍可排：2024-02-29、23:59、时区 -12 / +14、经度 ±180、1800 / 2200 年、字符串数字', function () {
    var ok = [{ year: 2024, month: 2, day: 29 }, { hour: 23, minute: 59 }, { hour: 0, minute: 0 }, { timezone: -12 }, { timezone: 14 },
      { trueSolar: true, longitude: 180 }, { trueSolar: true, longitude: -180 }, { year: 1800 }, { year: 2200 }, { year: '1990', month: '5', day: '17', hour: '10' }];
    var bad = ok.filter(function (c) { try { return !bz(c).bazi; } catch (e) { return true; } });
    return bad.length === 0 || ('被拒绝：' + JSON.stringify(bad));
  });
  t('非法输入不会产出命盘（抛错而非返回八字）', function () {
    try { var r = bz({ year: 2024, month: 2, day: 31 }); return '竟然返回了 ' + r.bazi; } catch (e) { return e.isInputError && /没有 31 日/.test(e.message) || e.message; }
  });
  /* ── 节气：内置表 vs 公式交叉核对（表外年份回退公式，误差上限据此标定） ── */
  t('节气表覆盖 1899–2101，每年 12 项且逐项递增', function () {
    var D = window.BaziShensha._debug, prev = -Infinity;
    if (D.JIEQI_TABLE_START_YEAR !== 1899 || D.JIEQI_TABLE_END_YEAR !== 2101) return '覆盖范围 ' + D.JIEQI_TABLE_START_YEAR + '–' + D.JIEQI_TABLE_END_YEAR;
    for (var y = 1899; y <= 2101; y++) for (var i = 0; i < 12; i++) {
      var t0 = D.jieqiFromTable(y, i).getTime();
      if (!(t0 > prev)) return y + ' 年第 ' + i + ' 节不递增';
      prev = t0;
    }
  });
  t('节气公式 vs 内置表：全部 2436 项偏差在 ±16 分钟内（实测 -14～+8）；含 1899 / 2101 边界年', function () {
    var D = window.BaziShensha._debug, worst = 0, at = '';
    for (var y = 1899; y <= 2101; y++) for (var i = 0; i < 12; i++) {
      var f = D.findSolarTerm(y + (i === 11 ? 1 : 0), D.JIEQI_LONGITUDES[i], i === 11 ? 1 : i + 2);
      var dev = (f.getTime() - D.jieqiFromTable(y, i).getTime()) / 60000;
      if (Math.abs(dev) > worst) { worst = Math.abs(dev); at = y + '/' + i; }
    }
    return worst <= 16 || ('最大偏差 ' + worst.toFixed(1) + ' 分钟 @' + at);
  });
  function yearText(y) { var c = window.BaziShensha.constants; return c.stems[((y - 4) % 10 + 10) % 10] + c.branches[((y - 4) % 12 + 12) % 12]; }
  function pillarsAtUTC(ms) { // 以 UTC 时刻排盘（timezone 0）
    var d = new Date(ms);
    return window.BaziShensha.calculate({ year: d.getUTCFullYear(), month: d.getUTCMonth() + 1, day: d.getUTCDate(), hour: d.getUTCHours(), minute: d.getUTCMinutes(), timezone: 0 });
  }
  t('立春临界（内置表）：1899 / 1900 / 2000 / 2100 / 2101 立春前 2 分钟归上年、后 2 分钟归本年', function () {
    var D = window.BaziShensha._debug, bad = [];
    [1899, 1900, 2000, 2100, 2101].forEach(function (y) {
      var lc = D.jieqiFromTable(y, 0).getTime();
      var before = pillarsAtUTC(lc - 2 * 60000).pillars.year.text, after = pillarsAtUTC(lc + 2 * 60000).pillars.year.text;
      if (before !== yearText(y - 1) || after !== yearText(y)) bad.push(y + ':' + before + '/' + after);
    });
    return bad.length === 0 || bad.join(' ');
  });
  t('表外年份（1898 / 2102）可排盘；立春前后 1 天仍归对年，且标记节气来源为公式', function () {
    var D = window.BaziShensha._debug, bad = [];
    [1898, 2102].forEach(function (y) {
      var lc = D.findSolarTerm(y, 315, 2).getTime();
      var b = pillarsAtUTC(lc - 86400000), a = pillarsAtUTC(lc + 86400000);
      if (b.pillars.year.text !== yearText(y - 1) || a.pillars.year.text !== yearText(y)) bad.push(y);
      if (a.jieqiSource !== 'formula') bad.push(y + ' source=' + a.jieqiSource);
    });
    return bad.length === 0 || bad.join(' ');
  });
  t('节气来源标记：1900–2100 为 table，其余为 formula', function () {
    return eq([bz({ year: 1900 }).jieqiSource, bz({ year: 2100 }).jieqiSource, bz({ year: 1899 }).jieqiSource, bz({ year: 2101 }).jieqiSource], ['table', 'table', 'formula', 'formula']);
  });
  t('1990-05-17 10:00 tz+8 返回完整四柱结构', function () {
    var r = window.BaziShensha.calculate({ year: 1990, month: 5, day: 17, hour: 10, timezone: 8 });
    if (!r.pillars || !r.bazi) return '无 pillars/bazi';
    var keys = ['year', 'month', 'day', 'hour'];
    for (var i = 0; i < keys.length; i++) {
      var p = r.pillars[keys[i]];
      if (!p || !p.stem || !p.branch || !p.text) return keys[i] + ' 柱不完整';
    }
    return r.bazi.split(' ').length === 4 || ('bazi 非四柱: ' + r.bazi);
  });
  t('晚子时（23:00）日柱进次日', function () {
    // 同一日历日 22:00 与 23:00，日柱应不同（23 点归次日）
    var a = window.BaziShensha.calculate({ year: 1990, month: 5, day: 17, hour: 22, timezone: 8 });
    var b = window.BaziShensha.calculate({ year: 1990, month: 5, day: 17, hour: 23, timezone: 8 });
    return a.pillars.day.text !== b.pillars.day.text || ('日柱未变: ' + a.pillars.day.text);
  });
  t('时柱：23:00 为子时', function () {
    var r = window.BaziShensha.calculate({ year: 1990, month: 5, day: 17, hour: 23, timezone: 8 });
    return r.pillars.hour.branch === '子' || ('时支=' + r.pillars.hour.branch);
  });
  t('时柱：11:00 为午时', function () {
    var r = window.BaziShensha.calculate({ year: 1990, month: 5, day: 17, hour: 11, timezone: 8 });
    return r.pillars.hour.branch === '午' || ('时支=' + r.pillars.hour.branch);
  });
  t('时区差异：不同 timezone 可正确回写且排盘不抛错', function () {
    var east = window.BaziShensha.calculate({ year: 2000, month: 1, day: 1, hour: 1, timezone: 8 });
    var west = window.BaziShensha.calculate({ year: 2000, month: 1, day: 1, hour: 1, timezone: -5 });
    if (east.input.timezone !== 8 || west.input.timezone !== -5) return 'timezone 回写错误';
    if (!east.pillars.day.text || !west.pillars.day.text) return '日柱缺失';
    return true;
  });
  t('默认时区为 +8', function () {
    var r = window.BaziShensha.calculate({ year: 1990, month: 5, day: 17, hour: 10 });
    return r.input.timezone === 8;
  });
  t('立春分界：年柱在立春前后应切换', function () {
    // 2024 立春约 2/4；取 2/3 与 2/5 对比年柱
    var before = window.BaziShensha.calculate({ year: 2024, month: 2, day: 3, hour: 12, timezone: 8 });
    var after = window.BaziShensha.calculate({ year: 2024, month: 2, day: 5, hour: 12, timezone: 8 });
    return before.pillars.year.text !== after.pillars.year.text ||
      ('年柱未变: ' + before.pillars.year.text + ' / ' + after.pillars.year.text);
  });
  t('五行统计与日主字段存在', function () {
    var r = window.BaziShensha.calculate({ year: 1990, month: 5, day: 17, hour: 10, timezone: 8 });
    return has(r, ['fiveElements', 'dayMaster', 'tenGods', 'shensha', 'relations']) === true &&
      has(r.dayMaster, ['stem', 'element', 'level']) === true;
  });

  /* ────────── 时区与日期转换（Bazi 内部路径） ────────── */
  section('时区与日期转换');
  t('trueSolar 标志可传入且不抛错', function () {
    var r = window.BaziShensha.calculate({
      year: 1990, month: 5, day: 17, hour: 10, minute: 30,
      timezone: 8, trueSolar: true, longitude: 116.4
    });
    return r.input.trueSolar === true && r.input.longitude === 116.4 && !!r.bazi;
  });
  t('无经度时 trueSolar 仍可运行', function () {
    var r = window.BaziShensha.calculate({

      4: [[1906, 6, 1], [1906, 6, 6], [1906, 6, 7], [1906, 6, 11]], 5: [[1903, 7, 4], [1903, 7, 9], [1903, 7, 10], [1903, 7, 14]],
      6: [[1911, 8, 4], [1911, 8, 9], [1911, 8, 10], [1911, 8, 14]], 7: [[1919, 9, 3], [1919, 9, 8], [1919, 9, 9], [1919, 9, 13]],
      8: [[1900, 10, 3], [1900, 10, 8], [1900, 10, 9], [1900, 10, 13]], 9: [[2014, 11, 2], [2014, 11, 7], [2014, 11, 8], [2014, 11, 12]],
      10: [[1984, 12, 2], [1984, 12, 7], [1984, 12, 8], [1984, 12, 12]], 11: [[2033, 12, 31], [2034, 1, 5], [2034, 1, 6], [2034, 1, 10]] };
    var lunarDays = [10, 15, 16, 20], bad = [];
    for (var m = 2; m <= 11; m++) {
      leapCases[m].forEach(function (d, idx) {
        var c = ZWC({ year: d[0], month: d[1], day: d[2], hour: 3, gender: '男' });
        if (!(c.lunar.isLeap && c.lunar.month === m && c.lunar.day === lunarDays[idx])) { bad.push('换算 ' + d.join('-') + ' → ' + JSON.stringify(c.lunar)); return; }
        var eMonth = m + (lunarDays[idx] > 15 ? 1 : 0);
        var expectMing = ZWI[(((2 + (eMonth - 1) - 2) % 12) + 12) % 12]; // 寅时 idx=2
        if (c.mingBranch !== expectMing) bad.push('闰' + m + '月' + lunarDays[idx] + '日 命宫 ' + c.mingBranch + ' 应为 ' + expectMing);
      });
    }
    return bad.length === 0 || bad.join('；');
  });
  t('闰十一月十六日后按十二月起盘（年干不变，不跨年）', function () {

  t('八字天罗地网：有则必同见（戌亥/辰巳），无则不同见；扫 1980–2009 逐月', function () {

      var r = window.BaziShensha.calculate({ year: y, month: m, day: 15, hour: 10, timezone: 8 });
      var br = ['year', 'month', 'day', 'hour'].map(function (k) { return r.pillars[k].branch; });
      var has = function (x) { return br.indexOf(x) >= 0; };
      var names = r.shensha.items.map(function (x) { return x.name; });

      if ((names.indexOf('天罗') >= 0) !== wantLuo) return y + '-' + m + ' 天罗不符 ' + br.join('');
      if ((names.indexOf('地网') >= 0) !== wantWang) return y + '-' + m + ' 地网不符 ' + br.join('');
      if (wantLuo || wantWang) hit++;

  /* ────────── 算法修正回归（v2.14） ────────── */
  section('算法修正回归（v2.14）');
  function shenshaItem(r, name) { for (var i = 0; i < r.shensha.items.length; i++) if (r.shensha.items[i].name === name) return r.shensha.items[i]; return null; }
  t('紫微宫名逆时针：命午→兄弟巳→夫妻辰……→父母未', function () {
    var c = ZWC({ year: 2000, month: 8, day: 16, hour: 3, gender: '女' });
    return eq(c.palaces.map(function (p) { return p.name + p.branch; }),
      ['命宫午', '兄弟巳', '夫妻辰', '子女卯', '财帛寅', '疾厄丑', '迁移子', '交友亥', '官禄戌', '田宅酉', '福德申', '父母未']);

  function jieqiDiffMin(name, y, m, d, cstISO) {
    var r = window.BaziShensha.calculate({ year: y, month: m, day: d, hour: 12, timezone: 8 });
    if (r.jieqi.name !== name) return '节气名不对 ' + r.jieqi.name;
    var diff = (Date.parse(r.jieqi.date) - Date.parse(cstISO)) / 60000;
    return Math.abs(diff) < 1 || ('差 ' + diff.toFixed(2) + ' 分钟');
  }
  t('节气：2024 立春落在 16:26–16:28（北京时间）', function () {
    var r = window.BaziShensha.calculate({ year: 2024, month: 2, day: 5, hour: 12, timezone: 8 });
    var d = new Date(new Date(r.jieqi.date).getTime() + 8 * 3600000);
    return (r.jieqi.name === '立春' && d.getUTCHours() === 16 && d.getUTCMinutes() >= 26 && d.getUTCMinutes() <= 28) || ('实得 ' + r.jieqi.date);
  });
  t('节气：2024 清明与官方差 <1 分钟', function () { return jieqiDiffMin('清明', 2024, 4, 5, '2024-04-04T15:02:03+08:00'); });
  t('节气：2024 芒种与官方差 <1 分钟', function () { return jieqiDiffMin('芒种', 2024, 6, 6, '2024-06-05T12:09:40+08:00'); });
  t('节气：2024 小暑与官方差 <1 分钟', function () { return jieqiDiffMin('小暑', 2024, 7, 7, '2024-07-06T22:19:49+08:00'); });
  t('节气：2024 大雪与官方差 <1 分钟', function () { return jieqiDiffMin('大雪', 2024, 12, 7, '2024-12-06T23:16:47+08:00'); });
  t('称骨闰月半月制：2023-04-10 闰二月二十（15时）月重 1.8、总重 5.3', function () {

  t('算命报告含所选纹路与取手提示，无 undefined', function () {

    return eq([PM.autoPick('heart', h(0.4, 0.12)), PM.autoPick('heart', h(0.4, 0.05)), PM.autoPick('heart', h(0.7, 0.12)), PM.autoPick('heart', h(0.7, 0.05))], [0, 1, 2, 3]);

  });
  t('图像核心：肤色分割能区分肤色与非肤色', function () {

    return eq(Array.prototype.slice.call(PM.skinMask(d, 2, 2)), [1, 0, 0, 1]);

  t('图像核心：最小代价路径走对角线、走不通返回 null', function () {
    var c = new Float32Array(9), tg = new Uint8Array(9), i, p;

  /* ────────── v2.16 摆正 + 自动解读 ────────── */
  section('v2.16 摆正 + 自动解读');
  var PR = window.YumiaoPalmRectify, PI = window.YumiaoPalmInsight;
  t('摆正模块已加载', function () { return !!PR && typeof PR.rectify === 'function' && typeof PR.init === 'function'; });
  t('解读模块已加载', function () { return !!PI && typeof PI.buildAutoInsight === 'function'; });
  t('仿射求解：缩放平移映射正确，共线返回 null', function () {
    var m = PR.solveAffine([[0, 0], [10, 0], [0, 10]], [[0, 0], [20, 0], [0, 20]]);
    if (!m) return '无解';
    var px = m[0] * 5 + m[2] * 5 + m[4], py = m[1] * 5 + m[3] * 5 + m[5];
    if (Math.abs(px - 10) > 1e-6 || Math.abs(py - 10) > 1e-6) return '映射不对 ' + px + ',' + py;
    if (PR.solveAffine([[0, 0], [1, 1], [2, 2]], [[0, 0], [1, 1], [2, 2]]) !== null) return '共线应返回 null';
    return true;
  });
  t('关键点校验：张开居中正向通过，并拢/偏心/侧向不通过，拇指方向判定', function () {
    function lm(o) {
      var base = [];
      for (var i = 0; i < 21; i++) base.push({ x: 0.5, y: 0.5 });
      for (var k in o) base[k] = o[k];
      return base;
    }
    var open = lm({ 0: { x: 0.5, y: 0.9 }, 4: { x: 0.3, y: 0.65 }, 5: { x: 0.38, y: 0.55 }, 8: { x: 0.32, y: 0.25 }, 9: { x: 0.5, y: 0.55 }, 12: { x: 0.5, y: 0.2 }, 17: { x: 0.62, y: 0.55 }, 20: { x: 0.68, y: 0.3 } });
    if (!PR.validateLandmarks(open).ok) return '张开正位应通过';
    if (PR.thumbSide(open) !== 'L') return '拇指在左应判左手';
    var openR = lm({ 0: { x: 0.5, y: 0.9 }, 4: { x: 0.7, y: 0.65 }, 5: { x: 0.62, y: 0.55 }, 8: { x: 0.68, y: 0.25 }, 9: { x: 0.5, y: 0.55 }, 12: { x: 0.5, y: 0.2 }, 17: { x: 0.38, y: 0.55 }, 20: { x: 0.32, y: 0.3 } });
    if (PR.thumbSide(openR) !== 'R') return '拇指在右应判右手';
    var closed = lm({ 0: { x: 0.5, y: 0.9 }, 4: { x: 0.45, y: 0.7 }, 5: { x: 0.38, y: 0.55 }, 8: { x: 0.4, y: 0.45 }, 9: { x: 0.5, y: 0.55 }, 12: { x: 0.5, y: 0.5 }, 17: { x: 0.62, y: 0.55 }, 20: { x: 0.6, y: 0.5 } });
    if (PR.validateLandmarks(closed).reason !== 'closed') return '并拢应判 closed';
    var off = lm({ 0: { x: 0.02, y: 0.9 }, 4: { x: -0.18, y: 0.65 }, 5: { x: -0.1, y: 0.55 }, 8: { x: -0.16, y: 0.25 }, 9: { x: 0.02, y: 0.55 }, 12: { x: 0.02, y: 0.2 }, 17: { x: 0.14, y: 0.55 }, 20: { x: 0.2, y: 0.3 } });
    if (PR.validateLandmarks(off).reason !== 'offcenter') return '偏心应判 offcenter';
    var side = lm({ 0: { x: 0.3, y: 0.5 }, 4: { x: 0.35, y: 0.3 }, 5: { x: 0.5, y: 0.35 }, 8: { x: 0.55, y: 0.3 }, 9: { x: 0.6, y: 0.5 }, 12: { x: 0.85, y: 0.5 }, 17: { x: 0.5, y: 0.65 }, 20: { x: 0.55, y: 0.7 } });
    if (PR.validateLandmarks(side).reason !== 'notupright') return '侧向应判 notupright';
    return true;
  });

  });
  t('周易：三爻动 → 本卦卦辞 + 变卦卦辞参断', function () {
    var r = YJ().judge(yjLines('111111', [0, 2, 4])), h = YJ().getHex('111111'), c = YJ().getHex(YJ().changedKey(yjLines('111111', [0, 2, 4])));
    return eq([r.rule.indexOf('三爻动') === 0, r.parts.map(function (p) { return p.classical; })], [true, [h.guaCi, c.guaCi]]);
  });
  t('周易：四爻动 → 取变卦两个不变爻爻辞，下爻为主（不再以变卦卦辞为主）', function () {
    var L = yjLines('111111', [0, 1, 2, 3]), r = YJ().judge(L), c = YJ().getHex(YJ().changedKey(L));
    if (r.rule.indexOf('四爻动') !== 0) return '断法：' + r.rule;
    return eq([r.parts[0].classical, r.parts[1].classical, /为主/.test(r.parts[0].t), /为辅/.test(r.parts[1].t)], [c.yaoCi[4], c.yaoCi[5], true, true]);
  });
  t('周易：64 卦端到端（独立文王卦序表）——按上/下卦起卦必须得到正确卦名与爻辞阴阳标签', function () {
    var tri = { '乾': [1,1,1], '兑': [1,1,0], '离': [1,0,1], '震': [1,0,0], '巽': [0,1,1], '坎': [0,1,0], '艮': [0,0,1], '坤': [0,0,0] };
    var KW = '乾乾 坤坤 坎震 艮坎 坎乾 乾坎 坤坎 坎坤 巽乾 乾兑 坤乾 乾坤 乾离 离乾 坤艮 震坤 兑震 艮巽 坤兑 巽坤 离震 艮离 艮坤 坤震 乾震 艮乾 艮震 兑巽 坎坎 离离 兑艮 震巽 乾艮 震乾 离坤 坤离 巽离 离兑 坎艮 震坎 艮兑 巽震 兑乾 乾巽 兑坤 坤巽 兑坎 坎巽 兑离 离巽 震震 艮艮 巽艮 震兑 震离 离艮 巽巽 兑兑 巽坎 坎兑 巽兑 震艮 坎离 离坎'.split(' ');
    var bad = [];
    KW.forEach(function (p, i) {
      var bits = tri[p[1]].concat(tri[p[0]]);
      var L = bits.map(function (b) { return { yang: !!b, moving: false }; });
      var h = YJ().getHex(YJ().linesToKey(L));
      if (!h || h.id !== i + 1) { bad.push((i + 1) + '→' + (h && h.id)); return; }
      for (var j = 0; j < 6; j++) if (h.yaoCi[j].split('：')[0].indexOf(bits[j] ? '九' : '六') < 0) bad.push((i + 1) + '爻' + (j + 1));
    });
    return bad.length === 0 || bad.slice(0, 8).join(' ');
  });
  t('周易：五爻动 → 取变卦唯一不变爻爻辞', function () {
    var L = yjLines('000000', [0, 1, 2, 3, 5]), r = YJ().judge(L), c = YJ().getHex(YJ().changedKey(L));
    if (r.rule.indexOf('五爻动') !== 0) return '断法：' + r.rule;
    return eq([r.parts[0].classical, r.parts[0].t.indexOf('变卦不变爻') === 0], [c.yaoCi[4], true]);
  });
  t('周易：四/五爻动的不变爻位置对所有组合都正确（C(6,4)+C(6,5) 共 21 种 × 乾坤）', function () {
    var bad = [];
    ['111111', '000000'].forEach(function (key) {
      for (var mask = 0; mask < 64; mask++) {
        var mv = []; for (var i = 0; i < 6; i++) if (mask & (1 << i)) mv.push(i);
        if (mv.length !== 4 && mv.length !== 5) continue;
        var L = yjLines(key, mv), r = YJ().judge(L), c = YJ().getHex(YJ().changedKey(L));
        var still = [0, 1, 2, 3, 4, 5].filter(function (i) { return mv.indexOf(i) < 0; });
        var want = still.map(function (i) { return c.yaoCi[i]; });
        var got = r.parts.slice(0, still.length).map(function (p) { return p.classical; });
        if (JSON.stringify(want) !== JSON.stringify(got) || !got.every(Boolean)) bad.push(key + ':' + mv.join(''));
      }
    });
    return bad.length === 0 || bad.slice(0, 5).join(' ');
  });
  t('周易：六爻全动 坤用六；其余卦以变卦卦辞断', function () {
    var kun = YJ().judge(yjLines('000000', [0, 1, 2, 3, 4, 5])), h2 = YJ().getHex('000000');
    var tun = YJ().judge(yjLines('010001', [0, 1, 2, 3, 4, 5])), c = YJ().getHex('101110');
    return eq([kun.rule.indexOf('用六') >= 0, kun.parts[0].t, kun.parts[0].classical, tun.rule.indexOf('变卦卦辞') >= 0, tun.parts[0].classical], [true, '用六', h2.yaoCi[6], true, c.guaCi]);
  });
  t('周易：64 卦 × 63 种动爻组合，变卦必存在且只翻动爻；全动即按位取反', function () {
    var keys = Object.keys(window.YIJING_DATA), bad = [];
    keys.forEach(function (key) {
      if (window.YIJING_DATA[key].key !== key) bad.push('key 字段 ' + key);
      for (var mask = 1; mask < 64; mask++) {
        var mv = []; for (var i = 0; i < 6; i++) if (mask & (1 << i)) mv.push(i);
        var L = yjLines(key, mv), ck = YJ().changedKey(L), exp = '';
        for (var j = 5; j >= 0; j--) exp += ((key.charAt(5 - j) === '1') !== (mv.indexOf(j) >= 0)) ? '1' : '0';
        if (ck !== exp || !YJ().getHex(ck)) bad.push(key + '/' + mask);
      }
      var comp = key.split('').map(function (c) { return c === '1' ? '0' : '1'; }).join('');
      if (YJ().changedKey(yjLines(key, [0, 1, 2, 3, 4, 5])) !== comp) bad.push('全动 ' + key);
    });
    return bad.length === 0 || bad.slice(0, 5).join(' ');
  });
  t('周易：judge 对 64 卦 × 0–6 动爻数都给出非空断辞', function () {
    var bad = [];
    Object.keys(window.YIJING_DATA).forEach(function (key) {
      for (var n = 0; n <= 6; n++) {
        var r = YJ().judge(yjLines(key, [0, 1, 2, 3, 4, 5].slice(0, n)));
        if (!r || !r.parts.length || !r.parts.every(function (p) { return p.classical; })) bad.push(key + '/' + n);
      }
    });
    return bad.length === 0 || bad.slice(0, 5).join(' ');
  });
  t('周易：印章字 toTrad 覆盖 64 卦名里所有有繁体的字（泽→澤 为→為 兑→兌 离→離 风→風）', function () {
    var simp = '泽为兑离风', all = Object.keys(window.YIJING_DATA).map(function (k) { return YJ().toTrad(window.YIJING_DATA[k].name); }).join('');
    var left = simp.split('').filter(function (c) { return all.indexOf(c) >= 0; });
    return left.length === 0 || ('仍含简体：' + left.join(''));
  });

  /* ────────── 错误边界 ────────── */
  section('错误边界');
  t('错误边界已安装', function () { return window.__yumiaoGuardInstalled === true; });
  t('错误边界：未捕获错误被处理且不白屏', function () {
    return typeof window.onerror === 'function' && window.onerror('测试错误', '', 0, 0, new Error('x')) === true;
  });

  if (pendingAsync === 0) finish();
})();
</script></body></html>
